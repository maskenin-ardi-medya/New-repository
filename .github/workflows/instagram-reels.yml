name: Instagram Reels

on:
  schedule:
    - cron: "*/30 * * * *"   # her 30 dakikada bir: zamanı gelen Reels varsa yayınlar
  workflow_dispatch:
    inputs:
      force_code:
        description: "Hemen yayınlanacak video kodu (ör. S10)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: instagram-reels
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reels yayınla
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FORCE_CODE: ${{ github.event.inputs.force_code }}
        run: python3 instagram/publish.py
      - name: Yayın kaydını sakla
        run: |
          git config user.name "Maskenin Ardi Bot"
          git config user.email "maskeninardimedya@gmail.com"
          git add instagram/published.json
          git diff --cached --quiet || (git commit -m "Yayın kaydı güncellendi" && git pull --rebase -q && git push)
